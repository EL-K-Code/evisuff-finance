[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evisuff-finance"
version = "0.3.0"
description = "Compositional evaluation of frontier finance agents in multi-department IPO workflows"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "statsmodels>=0.14"]

[project.scripts]
evisuff = "evisuff.cli:main"
evisuff-workflow = "evisuff.workflow_cli:main"
evisuff-experiment = "evisuff.experiment_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
