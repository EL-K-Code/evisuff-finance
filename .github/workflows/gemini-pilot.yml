name: Gemini two-case workflow pilot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-pilot.yml

permissions:
  contents: read

concurrency:
  group: gemini-two-case-pilot
  cancel-in-progress: false

jobs:
  safety:
    name: Prevent duplicate provider calls
    runs-on: ubuntu-latest
    steps:
      - name: Confirm no-op safety run
        run: echo "The approved two-case pilot is already running; this job makes no API calls."
