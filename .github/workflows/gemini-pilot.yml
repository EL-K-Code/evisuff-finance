name: Gemini two-case workflow pilot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-pilot.yml

permissions:
  contents: read

concurrency:
  group: gemini-two-case-pilot
  cancel-in-progress: true

jobs:
  safety:
    name: Cancel duplicate provider calls
    runs-on: ubuntu-latest
    steps:
      - name: Confirm no-op safety run
        run: echo "Duplicate provider runs are cancelled; this safety job makes no API calls."
