name: OpenRouter Reddit stateful generalist smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-pilot.yml

permissions:
  contents: read

concurrency:
  group: openrouter-reddit-generalist-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Reddit generalist v1 to v2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_BASE: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: openai/gpt-oss-120b:free

    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret and frozen model
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "Missing repository secret OPENROUTER_API_KEY" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/models",
              headers={
                  "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          available = {
              str(item.get("id", ""))
              for item in payload.get("data", [])
              if isinstance(item, dict)
          }
          model = os.environ["OPENROUTER_MODEL"]
          if model not in available:
              raise SystemExit(f"Required OpenRouter model is unavailable: {model}")
          print(f"Frozen OpenRouter model: {model}")
          PY

      - name: Install and validate benchmark
        shell: bash
        run: |
          python -m pip install -e .
          python tools/openrouter_structured_agent.py --self-test
          PYTHONPATH=src python -m unittest \
            tests.test_openrouter_structured_agent \
            tests.test_staged_workflow \
            tests.test_workflow_scoring_contract -v

      - name: Build secret-free two-call configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = {
              "experiment_id": "openrouter-reddit-staged-generalist-smoke-v1",
              "cases": ["../data/ipo_real_cases/reddit_2024/spec.json"],
              "conditions": ["staged_generalist"],
              "repetitions": 1,
              "output_root": "../results/openrouter_reddit_generalist_smoke",
              "systems": [
                  {
                      "system_id": "openrouter-openai-gpt-oss-120b-free",
                      "enabled": True,
                      "backend": {
                          "type": "command",
                          "command": [
                              "python",
                              "tools/openrouter_structured_agent.py",
                          ],
                          "timeout_seconds": 600,
                      },
                      "pricing_usd_per_million_tokens": {
                          "input": 0.0,
                          "output": 0.0,
                      },
                  }
              ],
          }
          path = Path("configs/openrouter_reddit_generalist_smoke.local.json")
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          print("Planned calls: 2")
          print("No API secret was written to the configuration.")
          PY

      - name: Run two-call stateful smoke
        shell: bash
        run: |
          mkdir -p results/openrouter_reddit_generalist_smoke
          PYTHONPATH=src python -m evisuff.staged_cli run \
            configs/openrouter_reddit_generalist_smoke.local.json \
            --output-root results/openrouter_reddit_generalist_smoke \
            --overwrite | tee results/openrouter_reddit_generalist_smoke/console_summary.json

      - name: Validate and print safe summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("results/openrouter_reddit_generalist_smoke/experiment_summary.json")
          summary = json.loads(path.read_text(encoding="utf-8"))
          reports = summary.get("reports", [])
          if len(reports) != 1:
              raise SystemExit(f"Expected one workflow report, found {len(reports)}")
          report = reports[0]
          safe = {
              "result_type": "openrouter_single_model_single_case_stateful_smoke_not_final_paper_results",
              "model": "openai/gpt-oss-120b:free",
              "case": "reddit",
              "condition": report.get("condition"),
              "status": report.get("status"),
              "initial_version": report.get("initial_version"),
              "final_version": report.get("final_version"),
              "round1_workflow_score": report.get("round1_workflow_score"),
              "workflow_score": report.get("workflow_score"),
              "component_score": report.get("component_score"),
              "coordination_score": report.get("coordination_score"),
              "composition_gap": report.get("composition_gap"),
              "enterprise_success": report.get("enterprise_success"),
              "update_success": report.get("update_success"),
              "stale_artifacts_after_update": report.get("stale_artifacts_after_update"),
              "call_count": report.get("call_count"),
              "planned_calls": 2,
              "input_tokens": report.get("total_input_tokens"),
              "output_tokens": report.get("total_output_tokens"),
              "estimated_cost_usd": report.get("estimated_cost_usd"),
              "error": report.get("error"),
          }
          Path("results/openrouter_reddit_generalist_smoke/safe_summary.json").write_text(
              json.dumps(safe, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(safe, indent=2))
          if report.get("status") != "completed":
              raise SystemExit("OpenRouter stateful smoke did not complete")
          PY

      - name: Upload OpenRouter smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-reddit-generalist-smoke-${{ github.run_id }}
          path: |
            results/openrouter_reddit_generalist_smoke/
            configs/openrouter_reddit_generalist_smoke.local.json
          if-no-files-found: warn
          retention-days: 30
