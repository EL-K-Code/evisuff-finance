name: Gemini Reddit stateful architecture comparison

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/gemini-pilot.yml

permissions:
  contents: read

concurrency:
  group: gemini-reddit-stateful-architecture-comparison
  cancel-in-progress: false

jobs:
  pilot:
    name: Reddit isolated then multi-agent
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_BASE: https://generativelanguage.googleapis.com/v1beta/openai
      GEMINI_MODEL: gemini-3.6-flash

    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret and exact model
        shell: bash
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "Missing repository secret GEMINI_API_KEY" >&2
            exit 1
          fi
          selected="$(python tools/select_gemini_model.py --preferred "${GEMINI_MODEL}")"
          if [ "${selected}" != "${GEMINI_MODEL}" ]; then
            echo "Required frozen model is unavailable: ${GEMINI_MODEL}" >&2
            echo "Model selector returned: ${selected}" >&2
            exit 1
          fi
          echo "Frozen model: ${selected}"

      - name: Install and validate stateful benchmark
        shell: bash
        run: |
          python -m pip install -e .
          python tools/gemini_structured_agent.py --self-test
          PYTHONPATH=src python -m unittest \
            tests.test_gemini_structured_agent \
            tests.test_staged_workflow \
            tests.test_workflow_scoring_contract -v
          PYTHONPATH=src python -m evisuff.real_cases_cli \
            data/ipo_real_cases/index.json \
            --output results/stateful_case_validation.json

      - name: Build secret-free comparison configurations
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = {
              "cases": ["../data/ipo_real_cases/reddit_2024/spec.json"],
              "repetitions": 1,
              "systems": [
                  {
                      "system_id": "gemini-gemini-3.6-flash",
                      "enabled": True,
                      "backend": {
                          "type": "command",
                          "command": ["python", "tools/gemini_structured_agent.py"],
                          "timeout_seconds": 600,
                      },
                      "pricing_usd_per_million_tokens": {
                          "input": 0.0,
                          "output": 0.0,
                      },
                  }
              ],
          }

          rows = (
              (
                  "isolated",
                  "staged_isolated",
                  "gemini-reddit-staged-isolated-pilot-v1",
                  "../results/gemini_stateful_reddit_isolated",
              ),
              (
                  "multi_agent",
                  "staged_multi_agent",
                  "gemini-reddit-staged-multi-agent-pilot-v1",
                  "../results/gemini_stateful_reddit_multi_agent",
              ),
          )
          for short_name, condition, experiment_id, output_root in rows:
              config = dict(base)
              config.update(
                  {
                      "experiment_id": experiment_id,
                      "conditions": [condition],
                      "output_root": output_root,
                  }
              )
              path = Path(f"configs/gemini_reddit_{short_name}.local.json")
              path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          print("Planned calls: 16 total (8 isolated + 8 multi-agent).")
          print("The two conditions run sequentially with a quota-cooling pause.")
          print("No API secret was written to either configuration.")
          PY

      - name: Run staged isolated — 8 calls
        shell: bash
        run: |
          mkdir -p results/gemini_stateful_reddit_isolated
          PYTHONPATH=src python -m evisuff.staged_cli run \
            configs/gemini_reddit_isolated.local.json \
            --output-root results/gemini_stateful_reddit_isolated \
            --overwrite | tee results/gemini_stateful_reddit_isolated/console_summary.json

      - name: Cool down free-tier quota
        shell: bash
        run: sleep 65

      - name: Run staged multi-agent — 8 calls
        shell: bash
        run: |
          mkdir -p results/gemini_stateful_reddit_multi_agent
          PYTHONPATH=src python -m evisuff.staged_cli run \
            configs/gemini_reddit_multi_agent.local.json \
            --output-root results/gemini_stateful_reddit_multi_agent \
            --overwrite | tee results/gemini_stateful_reddit_multi_agent/console_summary.json

      - name: Validate and print architecture comparison
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          missing = []
          for label, root in (
              ("staged_isolated", Path("results/gemini_stateful_reddit_isolated")),
              ("staged_multi_agent", Path("results/gemini_stateful_reddit_multi_agent")),
          ):
              path = root / "experiment_summary.json"
              if not path.exists():
                  missing.append(label)
                  rows.append({"condition": label, "status": "missing_after_provider_or_workflow_failure"})
                  continue
              summary = json.loads(path.read_text(encoding="utf-8"))
              reports = summary.get("reports", [])
              if len(reports) != 1:
                  rows.append({
                      "condition": label,
                      "status": "invalid_report_count",
                      "report_count": len(reports),
                  })
                  continue
              report = reports[0]
              rows.append(
                  {
                      "condition": report.get("condition"),
                      "status": report.get("status"),
                      "initial_version": report.get("initial_version"),
                      "final_version": report.get("final_version"),
                      "round1_workflow_score": report.get("round1_workflow_score"),
                      "workflow_score": report.get("workflow_score"),
                      "component_score": report.get("component_score"),
                      "coordination_score": report.get("coordination_score"),
                      "composition_gap": report.get("composition_gap"),
                      "enterprise_success": report.get("enterprise_success"),
                      "update_success": report.get("update_success"),
                      "stale_artifacts_after_update": report.get("stale_artifacts_after_update"),
                      "artifact_changed_after_update": report.get("artifact_changed_after_update"),
                      "call_count": report.get("call_count"),
                      "input_tokens": report.get("total_input_tokens"),
                      "output_tokens": report.get("total_output_tokens"),
                      "estimated_cost_usd": report.get("estimated_cost_usd"),
                      "error": report.get("error"),
                  }
              )

          safe = {
              "result_type": "single_model_single_case_two_architecture_stateful_pilot_not_final_paper_results",
              "model": "gemini-3.6-flash",
              "case": "reddit",
              "planned_calls": 16,
              "workflow_runs": rows,
          }
          output = Path("results/gemini_stateful_reddit_architecture_comparison.json")
          output.write_text(json.dumps(safe, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(safe, indent=2))
          if missing:
              raise SystemExit(f"Missing result(s): {', '.join(missing)}")
          if any(row.get("status") != "completed" for row in rows):
              raise SystemExit("At least one architecture run did not complete")
          PY

      - name: Upload complete architecture comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-reddit-stateful-architectures-${{ github.run_id }}
          path: |
            results/gemini_stateful_reddit_isolated/
            results/gemini_stateful_reddit_multi_agent/
            results/gemini_stateful_reddit_architecture_comparison.json
            results/stateful_case_validation.json
            configs/gemini_reddit_isolated.local.json
            configs/gemini_reddit_multi_agent.local.json
          if-no-files-found: warn
          retention-days: 30
