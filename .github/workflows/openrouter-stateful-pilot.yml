name: OpenRouter stateful amendment pilot

on:
  workflow_dispatch:
    inputs:
      case:
        description: IPO case to evaluate
        required: true
        default: reddit
        type: choice
        options:
          - reddit
          - coreweave
          - rubrik
      condition:
        description: Stateful orchestration condition
        required: true
        default: staged_generalist
        type: choice
        options:
          - staged_generalist
          - staged_isolated
          - staged_multi_agent
      model:
        description: Exact OpenRouter free model identifier
        required: true
        default: openai/gpt-oss-120b:free
        type: string

permissions:
  contents: read

concurrency:
  group: openrouter-stateful-amendment-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: OpenRouter stateful IPO evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_BASE: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: ${{ inputs.model }}
      PILOT_CASE: ${{ inputs.case }}
      PILOT_CONDITION: ${{ inputs.condition }}

    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret and exact model
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "Missing repository secret OPENROUTER_API_KEY" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/models",
              headers={
                  "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                  "Accept": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          available = {
              str(item.get("id", ""))
              for item in payload.get("data", [])
              if isinstance(item, dict)
          }
          model = os.environ["OPENROUTER_MODEL"]
          if model not in available:
              raise SystemExit(f"Required OpenRouter model is unavailable: {model}")
          print(f"Frozen OpenRouter model: {model}")
          PY

      - name: Install and validate benchmark
        shell: bash
        run: |
          python -m pip install -e .
          python tools/openrouter_structured_agent.py --self-test
          PYTHONPATH=src python -m unittest \
            tests.test_openrouter_structured_agent \
            tests.test_staged_workflow \
            tests.test_workflow_scoring_contract -v
          PYTHONPATH=src python -m evisuff.real_cases_cli \
            data/ipo_real_cases/index.json \
            --output results/openrouter_case_validation.json

      - name: Build secret-free stateful configuration
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          cases = {
              "reddit": "../data/ipo_real_cases/reddit_2024/spec.json",
              "rubrik": "../data/ipo_real_cases/rubrik_2024/spec.json",
              "coreweave": "../data/ipo_real_cases/coreweave_2025/spec.json",
          }
          condition = os.environ["PILOT_CONDITION"]
          planned_calls = 2 if condition == "staged_generalist" else 8
          config = {
              "experiment_id": (
                  f"openrouter-stateful-{os.environ['PILOT_CASE']}-"
                  f"{condition}-pilot-v1"
              ),
              "cases": [cases[os.environ["PILOT_CASE"]]],
              "conditions": [condition],
              "repetitions": 1,
              "output_root": "../results/openrouter_stateful_pilot",
              "systems": [
                  {
                      "system_id": f"openrouter-{os.environ['OPENROUTER_MODEL']}",
                      "enabled": True,
                      "backend": {
                          "type": "command",
                          "command": [
                              "python",
                              "tools/openrouter_structured_agent.py",
                          ],
                          "timeout_seconds": 600,
                      },
                      "pricing_usd_per_million_tokens": {
                          "input": 0.0,
                          "output": 0.0,
                      },
                  }
              ],
          }
          path = Path("configs/openrouter_stateful_pilot.local.json")
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"PLANNED_CALLS={planned_calls}\n")
          print(f"Planned calls: {planned_calls}")
          print("No API secret was written to the configuration.")
          PY

      - name: Run the stateful pilot
        shell: bash
        run: |
          mkdir -p results/openrouter_stateful_pilot
          PYTHONPATH=src python -m evisuff.staged_cli run \
            configs/openrouter_stateful_pilot.local.json \
            --output-root results/openrouter_stateful_pilot \
            --overwrite | tee results/openrouter_stateful_pilot/console_summary.json

      - name: Validate and print safe summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("results/openrouter_stateful_pilot/experiment_summary.json")
          summary = json.loads(path.read_text(encoding="utf-8"))
          reports = summary.get("reports", [])
          if len(reports) != 1:
              raise SystemExit(f"Expected one workflow report, found {len(reports)}")
          report = reports[0]
          safe = {
              "result_type": "single_model_single_case_openrouter_stateful_pilot_not_final_paper_results",
              "model": os.environ["OPENROUTER_MODEL"],
              "case": os.environ["PILOT_CASE"],
              "condition": report.get("condition"),
              "status": report.get("status"),
              "initial_version": report.get("initial_version"),
              "final_version": report.get("final_version"),
              "round1_workflow_score": report.get("round1_workflow_score"),
              "workflow_score": report.get("workflow_score"),
              "component_score": report.get("component_score"),
              "coordination_score": report.get("coordination_score"),
              "composition_gap": report.get("composition_gap"),
              "enterprise_success": report.get("enterprise_success"),
              "update_success": report.get("update_success"),
              "stale_artifacts_after_update": report.get("stale_artifacts_after_update"),
              "call_count": report.get("call_count"),
              "planned_calls": int(os.environ["PLANNED_CALLS"]),
              "input_tokens": report.get("total_input_tokens"),
              "output_tokens": report.get("total_output_tokens"),
              "estimated_cost_usd": report.get("estimated_cost_usd"),
              "error": report.get("error"),
          }
          Path("results/openrouter_stateful_pilot/safe_summary.json").write_text(
              json.dumps(safe, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(safe, indent=2))
          if report.get("status") != "completed":
              raise SystemExit("OpenRouter stateful run did not complete")
          PY

      - name: Upload OpenRouter pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-stateful-pilot-${{ github.run_id }}
          path: |
            results/openrouter_stateful_pilot/
            results/openrouter_case_validation.json
            configs/openrouter_stateful_pilot.local.json
          if-no-files-found: warn
          retention-days: 30
