name: V2 model access preflight

on:
  pull_request:
    branches: [main]
    types: [reopened]

jobs:
  preflight:
    if: contains(github.event.pull_request.title, '[MODEL PREFLIGHT V2]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run secret-safe GET-only access preflight
        shell: bash
        run: |
          mkdir -p results/model_access_preflight_v2
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          root = Path('.')
          result_dir = root / 'results' / 'model_access_preflight_v2'
          plan_path = root / 'configs' / 'bridge_v2_model_panel_candidate.json'
          protocol_path = root / 'configs' / 'bridge_v2_ipo_rubric_protocol.json'
          lock_path = root / 'configs' / 'bridge_v2_upstream_lock.json'
          ensemble_path = root / 'configs' / 'bridge_v2_ipo_rubric_ensemble.json'

          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          protocol = json.loads(protocol_path.read_text(encoding='utf-8'))
          lock = json.loads(lock_path.read_text(encoding='utf-8'))

          def get_json(url: str, headers: dict[str, str]) -> dict:
              req = urllib.request.Request(url, headers=headers, method='GET')
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              if not isinstance(payload, dict):
                  raise ValueError(f'Expected object from {url}')
              return payload

          openai_key = os.getenv('OPENAI_API_KEY', '').strip()
          openrouter_key = os.getenv('OPENROUTER_API_KEY', '').strip()
          openai_targets = ['gpt-5.6-sol', 'gpt-5.6-terra', 'gpt-5.6-luna']
          openrouter_targets = [
              'openai/gpt-oss-20b',
              'openai/gpt-oss-20b:free',
              'openai/gpt-5.6-sol',
              'openai/gpt-5.6-terra',
              'openai/gpt-5.6-luna',
          ]

          summary = {
              'preflight_id': 'evisuff-bridge-v2-model-access',
              'timestamp_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'request_policy': 'GET-only; no inference endpoint called',
              'model_generation_calls': 0,
              'openai': {
                  'secret_present': bool(openai_key),
                  'models_endpoint_checked': False,
                  'target_access': {model: False for model in openai_targets},
                  'error': None,
              },
              'openrouter': {
                  'secret_present': bool(openrouter_key),
                  'models_endpoint_checked': False,
                  'key_endpoint_checked': False,
                  'target_access': {model: False for model in openrouter_targets},
                  'key_metadata': {},
                  'error': None,
              },
          }

          if openai_key:
              try:
                  payload = get_json(
                      'https://api.openai.com/v1/models',
                      {
                          'Authorization': f'Bearer {openai_key}',
                          'Accept': 'application/json',
                      },
                  )
                  available = {
                      str(item.get('id', ''))
                      for item in payload.get('data', [])
                      if isinstance(item, dict)
                  }
                  summary['openai']['models_endpoint_checked'] = True
                  summary['openai']['target_access'] = {
                      model: model in available for model in openai_targets
                  }
              except Exception as exc:
                  summary['openai']['error'] = type(exc).__name__

          if openrouter_key:
              headers = {
                  'Authorization': f'Bearer {openrouter_key}',
                  'Accept': 'application/json',
              }
              errors = []
              try:
                  payload = get_json('https://openrouter.ai/api/v1/models', headers)
                  available = {
                      str(item.get('id', ''))
                      for item in payload.get('data', [])
                      if isinstance(item, dict)
                  }
                  summary['openrouter']['models_endpoint_checked'] = True
                  summary['openrouter']['target_access'] = {
                      model: model in available for model in openrouter_targets
                  }
              except Exception as exc:
                  errors.append(f'models:{type(exc).__name__}')
              try:
                  payload = get_json('https://openrouter.ai/api/v1/key', headers)
                  data = payload.get('data', {}) if isinstance(payload.get('data'), dict) else {}
                  allowed = {
                      'limit', 'usage', 'usage_daily', 'usage_weekly', 'usage_monthly',
                      'is_free_tier', 'limit_remaining', 'rate_limit'
                  }
                  summary['openrouter']['key_metadata'] = {
                      key: value for key, value in data.items() if key in allowed
                  }
                  summary['openrouter']['key_endpoint_checked'] = True
              except Exception as exc:
                  errors.append(f'key:{type(exc).__name__}')
              if errors:
                  summary['openrouter']['error'] = ';'.join(errors)

          required_openai = ['gpt-5.6-terra', 'gpt-5.6-luna']
          evaluated_access = all(
              summary['openai']['target_access'].get(model, False)
              for model in required_openai
          )
          sol_access = summary['openai']['target_access'].get('gpt-5.6-sol', False)
          openrouter_control = next(
              (
                  model for model in ('openai/gpt-oss-20b', 'openai/gpt-oss-20b:free')
                  if summary['openrouter']['target_access'].get(model, False)
              ),
              None,
          )

          summary['decision'] = {
              'evaluated_openai_models_accessible': evaluated_access,
              'candidate_sol_judge_accessible': sol_access,
              'openrouter_control_selected': openrouter_control,
              'model_ids_can_be_frozen': evaluated_access,
              'inference_allowed': False,
          }

          ensemble_sha256 = hashlib.sha256(ensemble_path.read_bytes()).hexdigest()
          protocol['source']['public_answer_ensemble'] = str(ensemble_path.relative_to(root))
          protocol['source']['public_answer_ensemble_sha256'] = ensemble_sha256
          protocol['gate_status']['rubric_construction_ensemble_frozen'] = True
          protocol['public_answer_ensemble_reused'] = True
          protocol['new_answer_generation_calls_required'] = 0
          protocol['status'] = 'public_answer_ensemble_frozen_judges_and_final_rubrics_pending'

          ipo_lock = lock['sources']['ipo_finance_agent']
          ipo_lock['rubric_construction_ensemble'] = str(ensemble_path.relative_to(root))
          ipo_lock['rubric_construction_ensemble_sha256'] = ensemble_sha256
          ipo_lock['rubric_construction_answer_sets_frozen'] = True
          lock['remaining_non_source_gates'] = [
              gate for gate in lock['remaining_non_source_gates']
              if gate != 'freeze IPO rubric-construction ensemble IDs'
          ]
          lock['status'] = 'public_items_and_ipo_answer_ensemble_frozen'
          lock['inference_allowed'] = False

          plan['status'] = (
              'exact_evaluated_model_ids_access_verified_judges_pending'
              if evaluated_access
              else 'preflight_complete_access_missing_or_unverified'
          )
          plan['access_preflight'] = summary
          plan['model_ids_frozen'] = evaluated_access
          plan['openrouter_control_frozen'] = openrouter_control
          plan['inference_allowed'] = False
          for judge in plan['judge_candidates'].values():
              model_id = judge['model_id']
              accessible = summary['openai']['target_access'].get(model_id, False)
              judge['access_verified'] = accessible
              judge['status'] = (
                  'accessible_pending_bias_review_and_freeze'
                  if accessible
                  else 'not_accessible_or_unverified'
              )

          result_dir.joinpath('safe_summary.json').write_text(
              json.dumps(summary, indent=2) + '\n', encoding='utf-8'
          )
          plan_path.write_text(json.dumps(plan, indent=2) + '\n', encoding='utf-8')
          protocol_path.write_text(json.dumps(protocol, indent=2) + '\n', encoding='utf-8')
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit secret-free preflight state
        shell: bash
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            configs/bridge_v2_model_panel_candidate.json \
            configs/bridge_v2_ipo_rubric_protocol.json \
            configs/bridge_v2_upstream_lock.json \
            results/model_access_preflight_v2/safe_summary.json
          git commit -m 'Record V2 model access preflight and freeze IPO answer ensemble'
          git push origin HEAD:"${PR_BRANCH}"

      - name: Upload safe preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-access-preflight-v2-${{ github.run_id }}
          path: results/model_access_preflight_v2/safe_summary.json
          if-no-files-found: error
          retention-days: 30
